; PlatformIO config for the 3.5" ESP32-S3 all-in-one display board
; (ESP32-S3R8, ST77922 QSPI panel + TDDI touch, ES8311 audio). See board.md.
; Display pins and settings live in include/app_config.h.

[platformio]
; WiFi (OTA) upload is the default. Use -e hosyond_esp32s3 for USB (first flash, or if OTA is off/broken)
default_envs = ota

[env:hosyond_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ESP32-S3R8: 8 MB octal PSRAM in-package, 16 MB QIO flash (esptool-detected)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16mb.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; USB-C goes to native USB (GPIO19/20), route Serial there
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; LVGL: configured by build flags instead of lv_conf.h
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    ; use the C library malloc so LVGL can grow into PSRAM
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CLIB
    -DLV_FONT_MONTSERRAT_14=1
    -DLV_FONT_MONTSERRAT_24=1
    ; EEZ Studio output includes <lvgl/lvgl.h>; expose libdeps dir so that path resolves
    -I.pio/libdeps/$PIOENV

lib_deps =
    lvgl/lvgl @ 9.5.0

; Upload over WiFi (default env): pio run -t upload
; Turn the OTA switch on (WiFi screen) first; the OTA row must say "Ready".
; Duplicated from include/app_config.h (WIFI_HOSTNAME, OTA_PORT, OTA_PASSWORD) - keep both in sync.
; If <host>.local doesn't resolve on Windows, set upload_port to the IP shown on the WiFi screen.
[env:ota]
extends = env:hosyond_esp32s3
upload_protocol = espota
upload_port = esp32-display.local
upload_flags =
    --port=3232
    --auth=esp32ota
